[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules", "lib"]
solc = "0.8.28"
# Creditcoin CC3 runs Frontier (polkadot-stable2409), and its block headers say
# what it supports: no mixHash (so no prevrandao), no withdrawalsRoot, and
# difficulty pinned to 0x0. That is a pre-Shanghai header.
#
# The real reason for london is Forge: its fork header validation demands
# prevrandao under Shanghai and panics without it, which breaks `forge script`
# against CC3.
#
# CORRECTION. This file previously also claimed the chain could not execute
# PUSH0. That was an inference from the block header, and it was wrong. Block
# structure and opcode support are independent on a Frontier EVM. Tested
# directly on live CC3: runtime `0x5f5ff3` (PUSH0 PUSH0 RETURN) deploys and
# executes, and a Shanghai-compiled contract stores state and reads
# block.prevrandao (as 0) without reverting.
#
# The pin stays because it is a safe subset, it keeps forge script working, and
# the deployed contracts are source-verified against these exact settings —
# changing it would alter bytecode and break that verification for no gain. It
# is a deliberate choice, not a requirement.
evm_version = "london"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [
  { access = "read", path = "./demo" },
  { access = "read-write", path = "./deployments" },
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
cc3_testnet = "${CC3_RPC}"
ethereum = "${ETH_MAINNET_RPC}"

# NOTE: no [etherscan] section. Foundry validates it at config-parse time and
# rejects chain 102031 outright ("Chain 102031 not supported") — which fails
# EVERY forge command, not just verification. `forge verify-contract` with an
# explicit --chain-id works fine, so verification lives in script/verify.sh.
